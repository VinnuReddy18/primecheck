name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: pip install -r requirements-dev.txt

      - name: lint
        run: ruff check .

      - name: test
        run: pytest --junitxml=test-results.xml

      - name: publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scan the working tree for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:0.76.0 \
            fs --scanners secret --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress /src

  chart:
    name: validate chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: lint
        run: helm lint charts/primecheck --set admin.token=placeholder

      - name: install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: validate rendered manifests
        run: |
          helm template primecheck charts/primecheck \
            --namespace primecheck \
            --set admin.token=placeholder \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0

  image:
    name: build and scan image
    runs-on: ubuntu-latest
    needs: [quality]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: resolve the registry path
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: primecheck:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: save the image for scanning and for the end to end job
        run: docker save primecheck:ci -o primecheck-ci.tar

      - name: scan the image
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" aquasec/trivy:0.76.0 \
            image --input /w/primecheck-ci.tar \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: primecheck-ci.tar
          retention-days: 1

      - name: log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha

      - name: record the digest
        if: github.event_name == 'push'
        run: |
          {
            echo "### image"
            echo ""
            echo "commit: \`${{ github.sha }}\`"
            echo "image:  \`${IMAGE}:${{ github.sha }}\`"
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: deploy to a cluster and verify
    runs-on: ubuntu-latest
    needs: [image, chart]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: load the image that was built and scanned
        run: |
          docker load -i primecheck-ci.tar
          kind load docker-image primecheck:ci --name ci

      - name: deploy
        run: |
          kubectl create namespace primecheck
          helm upgrade --install primecheck charts/primecheck \
            --namespace primecheck \
            -f charts/primecheck/values-ci.yaml \
            --set admin.token="$(openssl rand -hex 24)" \
            --wait --timeout 5m

      - name: show what is running
        run: |
          kubectl -n primecheck get deploy,pod,svc -o wide
          kubectl -n primecheck rollout status deploy/primecheck

      - name: verify the running version matches this commit
        run: |
          kubectl -n primecheck port-forward svc/primecheck 8000:80 &
          sleep 5
          version=$(curl -sf http://localhost:8000/version)
          echo "$version"
          echo "$version" | grep -q "${GITHUB_SHA}" || {
            echo "the running build does not report commit ${GITHUB_SHA}"
            exit 1
          }

      - name: verify the user journey
        run: |
          kubectl -n primecheck port-forward svc/primecheck 8001:80 &
          sleep 5
          curl -sf "http://localhost:8001/check?n=999983" | tee /tmp/prime.json
          grep -q '"prime":true' /tmp/prime.json
          curl -sf "http://localhost:8001/check?n=999984" | tee /tmp/composite.json
          grep -q '"prime":false' /tmp/composite.json
          curl -sf "http://localhost:8001/readyz" | grep -q '"status":"ready"'
          curl -sf "http://localhost:8001/metrics" | grep -q 'primecheck_checks_total'

      - name: verify a rollback restores service
        run: |
          helm -n primecheck upgrade primecheck charts/primecheck \
            -f charts/primecheck/values-ci.yaml \
            --set image.tag=does-not-exist \
            --set admin.token="$(openssl rand -hex 24)" \
            --wait --timeout 90s || echo "the bad release failed to become ready, as expected"
          helm -n primecheck rollback primecheck
          kubectl -n primecheck rollout status deploy/primecheck --timeout=3m
          kubectl -n primecheck port-forward svc/primecheck 8002:80 &
          sleep 5
          curl -sf "http://localhost:8002/check?n=7919" | grep -q '"prime":true'

      - name: collect evidence
        if: always()
        run: |
          mkdir -p evidence
          kubectl -n primecheck get all -o wide > evidence/resources.txt 2>&1 || true
          kubectl -n primecheck describe deploy primecheck > evidence/deployment.txt 2>&1 || true
          kubectl -n primecheck logs -l app.kubernetes.io/name=primecheck --tail=200 > evidence/logs.txt 2>&1 || true
          helm -n primecheck history primecheck > evidence/helm-history.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: evidence/
