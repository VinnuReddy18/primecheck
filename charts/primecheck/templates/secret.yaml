{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "primecheck.fullname" . }}-admin
  labels:
    {{- include "primecheck.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.secretKey }}: {{ required "set admin.token, or point admin.existingSecret at a secret you manage outside the chart" .Values.admin.token | quote }}
{{- end }}
