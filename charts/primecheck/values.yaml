replicaCount: 2

image:
  repository: ghcr.io/vinnureddy18/primecheck
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: primecheck.localtest.me
  tls:
    enabled: true
    secretName: primecheck-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi

rollout:
  maxSurge: 1
  maxUnavailable: 0

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 120

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: observability

serviceMonitor:
  enabled: false
  interval: 15s

prometheusRule:
  enabled: false

slo:
  availabilityTargetPercent: "99"
  errorRateThreshold: "0.01"
  latencyP95Seconds: "0.25"

admin:
  enabled: true
  existingSecret: ""
  secretKey: admin-token
  token: ""

app:
  sieveLimit: 1000000
  logLevel: INFO
  featureFactorHint: false
  tracing:
    enabled: false
    endpoint: http://jaeger-collector.observability.svc.cluster.local:4318
    excludedUrls: healthz,readyz,metrics
